<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kocka - Family games</title>
    <link rel="stylesheet" href="../bootstrap.css">
    <link rel="stylesheet" href="../style.css">
    <script src="../bootstrap.bundle.min.js"></script>
    <script src="../jquery-4.0.0.min.js"></script>
    <script src="../navbar.js"></script>
    <script src="../lang.js"></script>
    <script src="../pagesRS/game.js"></script>
    <script src="../game-list.js"></script>
</head>

<body id="family">
    <nav class="navbar navbar-expand-lg bg-body-tertiary"></nav>
    <main class="catalog">
        <div class="filters">
            <div class="filter-cont">
                <span><label for="sort-by">Sort by: </label></span>
                <select name="sort-by" id="sort-by" class="form-select" aria-label="Sort by">
                    <option value="nameAsc" selected>Name A-Z</option>
                    <option value="nameDesc">Name Z-A</option>
                    <option value="priceAsc">Price descending</option>
                    <option value="priceDesc">Price ascending</option>
                </select>
            </div>
        </div>
        <div class="games-cont"></div>
    </main>
</body>

</html>
