<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game details — Ludo</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
  <link rel="stylesheet" href="gameENG.css">
</head>

<body>

  <div id="gameData" data-id="covece-ne-ljuti-se" data-name="Ludo"
    data-description="A classic family race game. Move your four pawns around the board and be the first to bring them all home, knocking out opponents along the way."
    data-min-players="2" data-max-players="4" data-min-age="4" data-duration-min="20" data-duration-max="40"
    data-price="999" data-images="../img/covece-ne-ljuti-se-1.jpg"></div>

  <nav class="navbar navbar-light bg-white border-bottom mb-4">
    <div class="container">
      <span class="navbar-brand fw-bold">Ludo</span>
      <span class="position-relative">
        🛒 Cart
        <span id="cartBadge"
          class="badge rounded-pill bg-danger position-absolute top-0 start-100 translate-middle">0</span>
      </span>
    </div>
  </nav>

  <main class="container pb-5">

    <div class="row g-4">
      <div class="col-lg-6">
        <div id="demo" class="carousel slide" data-bs-ride="carousel">
          <div class="carousel-indicators">
            <button type="button" data-bs-target="#demo" data-bs-slide-to="0" class="active"></button>
            <button type="button" data-bs-target="#demo" data-bs-slide-to="1"></button>
          </div>

          <div class="carousel-inner">
            <div class="carousel-item active">
              <img src="../img/covece-ne-ljuti-se-1.jpg" alt="covece-ne-ljuti-se-1" class="d-block w-100">
            </div>
            <div class="carousel-item">
              <img src="../img/covece-ne-ljuti-se-2.jpg" alt="covece-ne-ljuti-se-2" class="d-block w-100">
            </div>
          </div>

          <button class="carousel-control-prev" type="button" data-bs-target="#demo" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
          </button>
          <button class="carousel-control-next" type="button" data-bs-target="#demo" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
          </button>
        </div>
      </div>

      <div class="col-lg-6">
        <h1 id="gameName" class="h2 mb-2"></h1>

        <div class="d-flex align-items-center gap-2 mb-3">
          <span id="avgStars" class="stars"></span>
          <span id="avgText" class="text-muted small"></span>
        </div>

        <p id="gameDesc" class="text-secondary"></p>

        <dl class="row meta-list mb-4">
          <dt class="col-6">Players</dt>
          <dd id="mPlayers" class="col-6 text-end"></dd>
          <dt class="col-6">Recommended age</dt>
          <dd id="mAge" class="col-6 text-end"></dd>
          <dt class="col-6">Play time</dt>
          <dd id="mDuration" class="col-6 text-end"></dd>
          <dt class="col-6">Price</dt>
          <dd id="mPrice" class="col-6 text-end fs-5 text-primary"></dd>
        </dl>

        <button id="addToCart" class="btn btn-primary btn-lg w-100">Add to cart</button>
        <div id="cartMsg" class="text-success small mt-2" style="min-height:1.2em;"></div>
      </div>
    </div>

    <hr class="my-5">

    <div class="row">
      <div class="col-lg-8">
        <h2 class="h4 mb-3">Ratings and comments</h2>
        <p id="summary" class="text-muted mb-4"></p>

        <div class="card review-card mb-4">
          <div class="card-body">
            <label class="form-label mb-1">Your rating</label>
            <div class="d-flex align-items-center gap-3 mb-3">
              <div id="starInput" class="star-input" role="radiogroup" aria-label="Your rating">
                <span data-v="1" role="radio" tabindex="0">★</span>
                <span data-v="2" role="radio" tabindex="0">★</span>
                <span data-v="3" role="radio" tabindex="0">★</span>
                <span data-v="4" role="radio" tabindex="0">★</span>
                <span data-v="5" role="radio" tabindex="0">★</span>
              </div>
              <span id="ratingLabel" class="text-muted small"></span>
            </div>

            <input id="author" class="form-control mb-2" placeholder="Your name (optional)">
            <textarea id="commentText" class="form-control mb-3" rows="3"
              placeholder="Write a comment (optional)"></textarea>

            <div class="d-flex align-items-center gap-3">
              <button id="submitReview" class="btn btn-success">Submit</button>
              <span id="formError" class="text-danger small"></span>
            </div>
          </div>
        </div>

        <div id="reviewList"></div>
      </div>
    </div>

  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="gameENG.js"></script>
</body>

</html>
